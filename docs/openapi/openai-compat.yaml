openapi: 3.1.0

info:
  title: Tama — OpenAI-Compatible API & Root Endpoints
  description: |
    This file documents two groups of endpoints served by Tama:

    1. **OpenAI-compatible `/v1/` routes** — Chat completions and model listing.
       These follow the OpenAI API spec closely so that any client written for
       OpenAI can be pointed at Tama with minimal changes.

    2. **Root utility endpoints** — `/health`, `/status`, and `/metrics`.
       `/metrics` returns Prometheus exposition format (merged proxy + backend
       metrics). For richer system health, use `GET /tama/v1/system/health`
       (see `tama-api.yaml`).

    **Base URL:** Point your OpenAI client at `http://localhost:8080` and set
    `OPENAI_API_KEY` to a `tama_` API key (or any non-empty string when API
    keys are disabled).
  version: 1.0.0
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local Tama instance (default port)

tags:
  - name: chat
    description: Chat completion inference endpoints
  - name: models
    description: OpenAI-compatible model listing
  - name: utility
    description: Root health, status, and metrics endpoints

paths:

  # ===========================================================================
  # OpenAI-compatible: Chat Completions
  # ===========================================================================

  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: Create a chat completion
      description: |
        Proxies the request to the appropriate backend for the requested model.

        If the model is not currently loaded, Tama will automatically start its
        backend before forwarding the request. Startup time is bounded by
        `proxy.startup_timeout_secs` in the Tama config.

        Supports both regular (buffered) and streaming (`"stream": true`) responses.
        For streaming, prefer `POST /v1/chat/completions/stream` to avoid
        buffering the full response body.

        **Model field:** The `model` field must match a key in the Tama config
        (e.g. `llama3`) or the underlying model name that config entry points to.
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
            examples:
              basic:
                summary: Simple user message
                value:
                  model: llama3
                  messages:
                    - role: user
                      content: "What is the capital of France?"
              with_system:
                summary: System + user message
                value:
                  model: llama3
                  messages:
                    - role: system
                      content: "You are a helpful assistant."
                    - role: user
                      content: "Explain quantum entanglement simply."
                  temperature: 0.7
                  max_tokens: 512
              streaming:
                summary: Streaming response
                value:
                  model: llama3
                  messages:
                    - role: user
                      content: "Write a short poem about Rust."
                  stream: true
      responses:
        "200":
          description: |
            Chat completion response. When `stream` is `false` (default), the
            full completion is returned as JSON. When `stream` is `true`, the
            response is a sequence of `text/event-stream` SSE chunks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
              example:
                id: chatcmpl-abc123
                object: chat.completion
                created: 1712000000
                model: llama3
                choices:
                  - index: 0
                    message:
                      role: assistant
                      content: "The capital of France is Paris."
                    finish_reason: stop
                usage:
                  prompt_tokens: 14
                  completion_tokens: 9
                  total_tokens: 23
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-Sent Events stream. Each event is a `data:` line
                  containing a `ChatCompletionChunk` JSON object. The stream
                  ends with `data: [DONE]`.
                example: |
                  data: {"id":"chatcmpl-abc123","object":"chat.completion.chunk","created":1712000000,"model":"llama3","choices":[{"index":0,"delta":{"role":"assistant","content":"The"},"finish_reason":null}]}

                  data: {"id":"chatcmpl-abc123","object":"chat.completion.chunk","created":1712000000,"model":"llama3","choices":[{"index":0,"delta":{"content":" capital"},"finish_reason":null}]}

                  data: [DONE]
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/chat/completions/stream:
    post:
      operationId: createStreamingChatCompletion
      summary: Create a streaming chat completion
      description: |
        Identical to `POST /v1/chat/completions` with `"stream": true`, but
        provided as a dedicated endpoint so that clients can target it directly
        without needing to set the stream flag in the body.

        The response is always a `text/event-stream` SSE stream regardless of
        the `stream` field in the request body.
      tags: [chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
            example:
              model: llama3
              messages:
                - role: user
                  content: "Count to five."
      responses:
        "200":
          description: SSE stream of chat completion chunks
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-Sent Events stream. Each event is a `data:` line
                  containing a `ChatCompletionChunk` JSON object. Ends with
                  `data: [DONE]`.
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  # ===========================================================================
  # OpenAI-compatible: Models
  # ===========================================================================

  /v1/models:
    get:
      operationId: listModels
      summary: List available models
      description: |
        Returns all enabled models defined in the Tama config in the OpenAI
        `list` response format.

        Each model entry includes a `ready` field (Tama extension) indicating
        whether the backend is currently running. This field is not part of the
        OpenAI spec but is safe to ignore.

        For richer operational data (PIDs, idle time, failure counts), use
        `GET /tama/v1/models` instead.
      tags: [models]
      responses:
        "200":
          description: List of models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
              example:
                object: list
                data:
                  - id: llama3
                    object: model
                    created: 1712000000
                    owned_by: llama-cpp
                    ready: true
                  - id: mistral
                    object: model
                    created: 0
                    owned_by: llama-cpp
                    ready: false

  /v1/models/{model_id}:
    get:
      operationId: getModel
      summary: Get a model by ID
      description: |
        Returns a single model object for the given model ID.

        The `model_id` can be either the Tama config key (e.g. `llama3`) or
        the underlying model name (e.g. `meta-llama/Meta-Llama-3-8B-Instruct`).

        Returns the model's `ready` state (Tama extension) in addition to
        standard OpenAI fields.
      tags: [models]
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
            example: llama3
          description: Model config key or underlying model name
      responses:
        "200":
          description: Model object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
              example:
                id: llama3
                object: model
                created: 1712000000
                owned_by: llama-cpp
                ready: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/model/info:
    get:
      operationId: getLiteLLMModelInfo
      summary: List model info (LiteLLM-compatible discovery)
      description: |
        Returns all enabled models (plus alias entries) in LiteLLM's
        `model_info_v1` discovery shape: `{ "data": [ { model_name,
        litellm_params, model_info } ] }` — one entry per enabled model plus
        alias entries (same set and inheritance rules as the opencode
        discovery endpoint). `?litellm_model_id=<name>` filters to the single
        entry whose `model_name` matches (an unknown id yields an empty
        `data` array; an absent or empty value returns the full list).

        Requires the `Inference` scope. The same handler is served at
        `GET /model/info` (also requires the `Inference` scope).
      tags: [models]
      parameters:
        - name: litellm_model_id
          in: query
          required: false
          schema:
            type: string
            example: qwen3-8b
          description: |
            Filter to the single entry whose `model_name` matches. Unknown id
            → empty `data`; absent/empty → full list.
      responses:
        "200":
          description: Model info entries in the LiteLLM `data` array shape
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiteLLMModelInfoList"
              example:
                data:
                  - model_name: qwen3-8b
                    litellm_params:
                      model: qwen3-8b
                      provider: llama.cpp
                    model_info:
                      id: qwen3-8b
                      mode: chat
                      litellm_provider: llama.cpp
                      max_input_tokens: 262144
                      max_output_tokens: 32768
                      max_tokens: 32768
                      supports_function_calling: true
                      supports_reasoning: true
                      supports_vision: true
                      supports_audio_input: false
                      supports_pdf_input: false
                      input_cost_per_token: 0.0
                      output_cost_per_token: 0.0
                      cache_read_input_token_cost: 0.0
                      cache_creation_input_token_cost: 0.0
                      reasoning_effort_levels: [none, low, medium, xhigh]
                      supports_none_reasoning_effort: true
                      supports_minimal_reasoning_effort: false
                      supports_low_reasoning_effort: true
                      supports_xhigh_reasoning_effort: true
                      supports_max_reasoning_effort: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /model/info:
    get:
      operationId: getLiteLLMModelInfoAlt
      summary: List model info (LiteLLM-compatible)
      description: |
        Identical handler and response to `GET /v1/model/info`, served at the
        non-prefixed path. Requires a valid API key (auth middleware) and the
        `Inference` scope — the same authorization contract as its `/v1` twin.
      tags: [models]
      parameters:
        - name: litellm_model_id
          in: query
          required: false
          schema:
            type: string
            example: qwen3-8b
          description: |
            Filter to the single entry whose `model_name` matches. Unknown id
            → empty `data`; absent/empty → full list.
      responses:
        "200":
          description: Model info entries in the LiteLLM `data` array shape
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiteLLMModelInfoList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ===========================================================================
  # Root utility endpoints
  # ===========================================================================

  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: |
        Lightweight liveness check. Always returns `{"status": "ok"}` if the
        process is running. Intended for use by process supervisors, load
        balancers, and container health checks.

        For a richer health snapshot including VRAM and loaded model count, use
        `GET /tama/v1/system/health`.
      tags: [utility]
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: tama-proxy

  /status:
    get:
      operationId: getStatus
      summary: Detailed proxy status
      description: |
        Returns comprehensive operational status including:
        - VRAM usage (if a GPU is detected)
        - Per-model runtime state (loaded, PID, idle timers, circuit breaker counters)
        - Aggregate request metrics

        Models are returned as a keyed object (`{ "llama3": { ... } }`).
      tags: [utility]
      responses:
        "200":
          description: Proxy status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
              examples:
                with_loaded_model:
                  summary: One model loaded
                  value:
                    vram:
                      used_mib: 8192
                      total_mib: 16384
                    idle_timeout_secs: 300
                    metrics:
                      total_requests: 42
                      successful_requests: 40
                      failed_requests: 2
                      models_loaded: 3
                      models_unloaded: 1
                    models:
                      llama3:
                        backend: llama-cpp
                        backend_path: /usr/local/bin/llama-server
                        model: meta-llama/Meta-Llama-3-8B-Instruct
                        quant: Q4_K_M
                        profile: null
                        context_length: 4096
                        enabled: true
                        loaded: true
                        backend_pid: 12345
                        load_time_secs: 1712000000
                        last_accessed_secs_ago: 42
                        idle_timeout_remaining_secs: 258
                        consecutive_failures: 0
                      mistral:
                        backend: llama-cpp
                        backend_path: /usr/local/bin/llama-server
                        model: mistralai/Mistral-7B-v0.1
                        quant: Q5_K_M
                        profile: null
                        context_length: 8192
                        enabled: true
                        loaded: false
                        backend_pid: null
                        load_time_secs: null
                        last_accessed_secs_ago: null
                        idle_timeout_remaining_secs: null
                        consecutive_failures: null

  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics (proxy + backend merged)
      description: |
        Returns merged metrics in Prometheus exposition format for Grafana ingestion.
        - Tama proxy metrics use `tama:` prefix (e.g., `tama:total_requests`)
        - Backend metrics (e.g., `llamacpp:*`) include `{server="<name>"}` labels
        - Backends that are unreachable are skipped with a logged warning
      tags: [utility]
      responses:
        "200":
          description: Prometheus text format metrics
          content:
            text/plain:
              schema:
                type: string
                description: Prometheus exposition format
              example: |
                # HELP tama:total_requests Total number of requests proxied.
                # TYPE tama:total_requests gauge
                tama:total_requests 98
                # HELP tama:successful_requests Number of successful (2xx) requests.
                # TYPE tama:successful_requests gauge
                tama:successful_requests 90
                # HELP tama:failed_requests Number of failed (non-2xx) requests.
                # TYPE tama:failed_requests gauge
                tama:failed_requests 4
                # HELP tama:models_loaded Cumulative number of model load events.
                # TYPE tama:models_loaded gauge
                tama:models_loaded 2
                # HELP tama:models_unloaded Cumulative number of model unload events.
                # TYPE tama:models_unloaded gauge
                tama:models_unloaded 1
                # HELP tama:active_models Current number of active (ready) models.
                # TYPE tama:active_models gauge
                tama:active_models 1
                # HELP llamacpp:prompt_tokens_total Number of prompt tokens processed.
                # TYPE llamacpp:prompt_tokens_total counter
                llamacpp:prompt_tokens_total{server="my-model"} 32479

# ===========================================================================
# Components
# ===========================================================================

components:

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Model 'foo' not found"
              type: NotFoundError

    BadRequest:
      description: Invalid request body or parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Missing required field: model"
              type: BadRequestError

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Failed to load model: timeout after 60s"
              type: LoadModelError

    Unauthorized:
      description: "Missing or invalid API key (or a `tama_` key provided while API keys are disabled)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Invalid or missing API key"
              type: UnauthorizedError

    Forbidden:
      description: "API key lacks the required scope for this route (e.g. `Inference` for `/v1/*`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "missing required scope: inference"
              type: ForbiddenError

  schemas:

    # -------------------------------------------------------------------------
    # Chat Completion schemas (OpenAI-compatible)
    # -------------------------------------------------------------------------

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
          description: The role of the message author
          example: user
        content:
          type: string
          nullable: true
          description: The text content of the message. May be `null` for tool-use messages.
          example: "What is the capital of France?"
        name:
          type: string
          description: Optional name for the participant (used in multi-user scenarios)

    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          description: |
            Tama config key (e.g. `llama3`) or underlying model name.
            If the model is not loaded, Tama will start its backend automatically.
          example: llama3
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatMessage"
          description: Conversation history including the new user turn
        temperature:
          type: number
          format: float
          minimum: 0
          maximum: 2
          description: Sampling temperature. Higher values produce more random output.
          example: 0.7
        top_p:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Nucleus sampling probability mass
          example: 0.9
        max_tokens:
          type: integer
          format: int32
          minimum: 1
          description: Maximum number of tokens to generate
          example: 512
        stream:
          type: boolean
          default: false
          description: Whether to stream the response as Server-Sent Events
          example: false
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: Stop sequence(s). Generation halts when any of these strings is produced.
          example: ["\n\n", "Human:"]
        presence_penalty:
          type: number
          format: float
          minimum: -2
          maximum: 2
          description: Penalise new tokens based on whether they appear in the text so far
          example: 0.0
        frequency_penalty:
          type: number
          format: float
          minimum: -2
          maximum: 2
          description: Penalise new tokens based on their frequency in the text so far
          example: 0.0
        user:
          type: string
          description: Unique identifier for the end user (passed through to backend)

    ChatCompletionChoice:
      type: object
      required: [index, message, finish_reason]
      properties:
        index:
          type: integer
          description: Index of this choice (always 0 for single completions)
          example: 0
        message:
          $ref: "#/components/schemas/ChatMessage"
        finish_reason:
          type: string
          nullable: true
          enum: [stop, length, tool_calls, content_filter, null]
          description: |
            Why generation stopped:
            - `stop` — natural end or stop sequence reached
            - `length` — `max_tokens` reached
            - `tool_calls` — model called a tool
            - `content_filter` — filtered by content policy
            - `null` — stream chunk (not the final chunk)
          example: stop

    UsageStats:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens:
          type: integer
          description: Tokens in the input prompt
          example: 14
        completion_tokens:
          type: integer
          description: Tokens generated
          example: 9
        total_tokens:
          type: integer
          description: Total tokens consumed
          example: 23

    ChatCompletionResponse:
      type: object
      required: [id, object, created, model, choices]
      properties:
        id:
          type: string
          description: Unique completion ID
          example: chatcmpl-abc123
        object:
          type: string
          enum: [chat.completion]
          example: chat.completion
        created:
          type: integer
          format: int64
          description: Unix timestamp of creation
          example: 1712000000
        model:
          type: string
          description: Model that generated the completion
          example: llama3
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ChatCompletionChoice"
        usage:
          $ref: "#/components/schemas/UsageStats"
          description: Token usage statistics (may be absent in streaming)

    # -------------------------------------------------------------------------
    # Model listing schemas (OpenAI-compatible)
    # -------------------------------------------------------------------------

    Model:
      type: object
      required: [id, object, created, owned_by]
      properties:
        id:
          type: string
          description: Model identifier (Tama config key)
          example: llama3
        object:
          type: string
          enum: [model]
          example: model
        created:
          type: integer
          format: int64
          description: Unix timestamp when the model was loaded (0 if never loaded)
          example: 1712000000
        owned_by:
          type: string
          description: Backend that owns/serves this model
          example: llama-cpp
        ready:
          type: boolean
          description: |
            **Tama extension** (not in OpenAI spec). Whether the backend is
            currently running and accepting requests.
          example: true

    ModelList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          enum: [list]
          example: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"

    # -------------------------------------------------------------------------
    # LiteLLM-compatible model info schemas (`/v1/model/info`, `/model/info`)
    # -------------------------------------------------------------------------

    LiteLLMParams:
      type: object
      required: [model, provider]
      properties:
        model:
          type: string
          description: "The name the client calls the model with (same as `model_name`)"
          example: qwen3-8b
        provider:
          type: string
          description: The backend serving the model
          example: llama.cpp

    LiteLLMModelInfo:
      type: object
      required: [id, mode, litellm_provider, supports_function_calling, supports_reasoning, supports_vision, supports_audio_input, supports_pdf_input, input_cost_per_token, output_cost_per_token, cache_read_input_token_cost, cache_creation_input_token_cost]
      properties:
        id:
          type: string
          description: "Model identifier (same as `model_name`)"
          example: qwen3-8b
        mode:
          type: string
          enum: [chat]
          description: "Always `chat`"
        litellm_provider:
          type: string
          description: The backend serving the model
          example: llama.cpp
        max_input_tokens:
          type: integer
          format: int32
          nullable: true
          description: "Context length (config override → vLLM `max_model_len` → live backend → HF metadata → model TOML)"
          example: 262144
        max_output_tokens:
          type: integer
          format: int32
          nullable: true
          description: "1/8 of context, clamped 16K–32K (same heuristic as the opencode `limit.output`)"
          example: 32768
        max_tokens:
          type: integer
          format: int32
          nullable: true
          description: LiteLLM legacy field — `max_output_tokens` when known, else `max_input_tokens`
          example: 32768
        supports_function_calling:
          type: boolean
          description: "From the backend `/props` (defaults to `true` when no /props data exists)"
          example: true
        supports_reasoning:
          type: boolean
          description: "`/props` reasoning OR non-empty `reasoning_levels` (ADR-0008)"
          example: true
        supports_vision:
          type: boolean
          description: "`modalities.input` contains `image`"
          example: true
        supports_audio_input:
          type: boolean
          description: "`modalities.input` contains `audio`"
          example: false
        supports_pdf_input:
          type: boolean
          description: "`modalities.input` contains `pdf`"
          example: false
        input_cost_per_token:
          type: number
          format: float
          description: "Always `0` — local inference, no per-token pricing"
          example: 0.0
        output_cost_per_token:
          type: number
          format: float
          description: "Always `0` — local inference, no per-token pricing"
          example: 0.0
        cache_read_input_token_cost:
          type: number
          format: float
          description: "Always `0` — local inference, no per-token pricing"
          example: 0.0
        cache_creation_input_token_cost:
          type: number
          format: float
          description: "Always `0` — local inference, no per-token pricing"
          example: 0.0
        reasoning_effort_levels:
          type: array
          nullable: true
          items:
            type: string
            enum: [none, minimal, low, medium, high, xhigh, max]
          description: |
            Stored `reasoning_levels` with `off` → `none` (ADR-0009). **Absent**
            when the model has no configured levels (LiteLLM treats absent as
            "unknown — advertise nothing"). `medium`/`high` appear only here —
            they have no per-level flag.
          example: [none, low, medium, xhigh]
        supports_minimal_reasoning_effort:
          type: boolean
          nullable: true
          description: "Present only when levels are configured; `true` when the list contains `minimal`"
          example: false
        supports_low_reasoning_effort:
          type: boolean
          nullable: true
          description: "Present only when levels are configured; `true` when the list contains `low`"
          example: true
        supports_none_reasoning_effort:
          type: boolean
          nullable: true
          description: "Present only when levels are configured; `true` when the list contains `none` (the ADR-0009 wire form of stored `off`)"
          example: true
        supports_xhigh_reasoning_effort:
          type: boolean
          nullable: true
          description: "Present only when levels are configured; `true` when the list contains `xhigh`"
          example: true
        supports_max_reasoning_effort:
          type: boolean
          nullable: true
          description: "Present only when levels are configured; `true` when the list contains `max`"
          example: false

    LiteLLMModelInfoEntry:
      type: object
      required: [model_name, litellm_params, model_info]
      properties:
        model_name:
          type: string
          description: "`api_name` / `model` (or alias name)"
          example: qwen3-8b
        litellm_params:
          $ref: "#/components/schemas/LiteLLMParams"
        model_info:
          $ref: "#/components/schemas/LiteLLMModelInfo"

    LiteLLMModelInfoList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          description: "One entry per enabled model plus alias entries; empty when `?litellm_model_id` matches nothing"
          items:
            $ref: "#/components/schemas/LiteLLMModelInfoEntry"

    # -------------------------------------------------------------------------
    # Root utility schemas
    # -------------------------------------------------------------------------

    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
          example: ok
        service:
          type: string
          example: tama-proxy

    VramInfo:
      type: object
      required: [used_mib, total_mib]
      properties:
        used_mib:
          type: integer
          format: int64
          description: VRAM in use (MiB)
          example: 8192
        total_mib:
          type: integer
          format: int64
          description: Total VRAM (MiB)
          example: 16384

    StatusModelEntry:
      type: object
      description: Per-model entry in the /status response (keyed by model name)
      properties:
        backend:
          type: string
          example: llama-cpp
        backend_path:
          type: string
          description: Filesystem path to the backend executable
          example: /usr/local/bin/llama-server
        model:
          type: string
          nullable: true
          example: meta-llama/Meta-Llama-3-8B-Instruct
        quant:
          type: string
          nullable: true
          example: Q4_K_M
        profile:
          type: string
          nullable: true
          description: Hardware profile override
          example: null
        context_length:
          type: integer
          format: int32
          nullable: true
          example: 4096
        enabled:
          type: boolean
          example: true
        loaded:
          type: boolean
          example: true
        backend_pid:
          type: integer
          format: int32
          nullable: true
          example: 12345
        load_time_secs:
          type: integer
          format: int64
          nullable: true
          example: 1712000000
        last_accessed_secs_ago:
          type: integer
          format: int64
          nullable: true
          example: 42
        idle_timeout_remaining_secs:
          type: integer
          format: int64
          nullable: true
          example: 258
        consecutive_failures:
          type: integer
          format: int32
          nullable: true
          example: 0

    StatusMetrics:
      type: object
      required:
        - total_requests
        - successful_requests
        - failed_requests
        - models_loaded
        - models_unloaded
      properties:
        total_requests:
          type: integer
          format: int64
          example: 42
        successful_requests:
          type: integer
          format: int64
          example: 40
        failed_requests:
          type: integer
          format: int64
          example: 2
        models_loaded:
          type: integer
          format: int64
          description: Cumulative number of model load events since startup
          example: 3
        models_unloaded:
          type: integer
          format: int64
          description: Cumulative number of model unload events since startup
          example: 1

    StatusResponse:
      type: object
      required: [idle_timeout_secs, metrics, models]
      properties:
        vram:
          $ref: "#/components/schemas/VramInfo"
          nullable: true
          description: GPU VRAM info. `null` on CPU-only systems.
        idle_timeout_secs:
          type: integer
          format: int64
          description: Configured idle timeout in seconds
          example: 300
        metrics:
          $ref: "#/components/schemas/StatusMetrics"
        models:
          type: object
          description: |
            Per-model status keyed by model config name.
            Each value is a `StatusModelEntry`.
          additionalProperties:
            $ref: "#/components/schemas/StatusModelEntry"

    # -------------------------------------------------------------------------
    # Shared error schema
    # -------------------------------------------------------------------------

    ErrorDetail:
      type: object
      required: [message, type]
      properties:
        message:
          type: string
          description: Human-readable error description
          example: "Missing required field: model"
        type:
          type: string
          description: Machine-readable error type
          example: BadRequestError

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
