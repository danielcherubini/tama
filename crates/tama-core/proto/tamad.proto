syntax = "proto3";

package tamad;

service TamadService {
  rpc ListProviders(Empty) returns (ListProvidersResponse);
  rpc InstallProvider(InstallProviderRequest) returns (JobIdResponse);
  rpc LoadModel(LoadModelRequest) returns (LoadModelResponse);
  rpc UnloadModel(UnloadModelRequest) returns (Empty);
  rpc UpdateProvider(UpdateProviderRequest) returns (JobIdResponse);
  rpc RemoveProvider(RemoveProviderRequest) returns (Empty);
  rpc Logs(LogsRequest) returns (stream LogEntry);
  rpc HealthCheck(Empty) returns (HealthResponse);
  rpc StreamStats(StatsRequest) returns (stream SystemStats);
  rpc StreamJob(JobRequest) returns (stream JobEvent);
  rpc RestartProvider(RestartProviderRequest) returns (Empty);
  rpc PullModel(PullModelRequest) returns (JobIdResponse);
  rpc RunBenchmark(RunBenchmarkRequest) returns (JobIdResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);

  // plan-195 task 6 (stage 2a): structured log push. SERVER-STREAMING:
  // the tamad is the gRPC *server* (it already serves this service) and
  // the proxy is the dialing *client* — the same transport, auth, and
  // dial path as PullModel/Logs/Stats. The proxy hosts no gRPC server
  // (REST/HTTP+SSE only), so the tamad never dials; a stream connection
  // means "the proxy wants logs right now". The tamad's handler sends
  // `StreamInit{instance_id, start_seq_by_source}` FIRST, then the
  // replay ring, oldest→newest, then live entries, until the client
  // disconnects. `instance_id` is per-boot and `seq` is per-source,
  // so late replays and dedup on the proxy side (task 7) are keyed on
  // (instance_id, seq). Nothing is reset on connect: a reconnect re-
  // replays the ring under the same per-boot identity. Capability gate:
  // the register response carries `supports_stream_logs` (absent on old
  // proxies ⇒ the tamad treats it as false); old proxy + new tamad ⇒
  // the proxy never dials and nothing changes on the wire.
  rpc StreamLogs(Empty) returns (stream StreamLogMessage);
}

message Empty {}

message LoadModelRequest {
  string provider_name = 1;
  string model_path = 2;
  string gpu_variant = 3;
  map<string, string> params = 4;
  string model_name = 5;
  string command = 6;
  repeated string args = 7;
  map<string, string> env = 8;
  string health_url = 9;
  int64 health_timeout_ms = 10;
  // plan-191 Task 10: the model's configured GPU device (e.g. "GPU1") or
  // empty. The proxy never samples local hardware (ADR-0010), so device→env
  // resolution (CUDA_VISIBLE_DEVICES & co.) happens on the tamad, which owns
  // the hardware. Empty = GPU auto-assign / CPU only.
  string gpu_device = 11;

  // Serialized DockerConfig JSON when the model's backend runs inside a
  // Docker container (restored exec path; the tamad holds no DB, so the
  // proxy ships the container config). Empty = native host binary.
  string docker_config_json = 12;
}

message LoadModelResponse {
  string endpoint_url = 1;
  int32 pid = 2;
  string status = 3;
}

message UnloadModelRequest {
  string provider_name = 1;
  string model_name = 2;
}

message ListProvidersResponse {
  repeated ProviderInfo providers = 1;
}

message ProviderInfo {
  string name = 1;
  string engine = 2;
  string version = 3;
  string status = 4;
  string gpu_variant = 5;
  repeated ProcessInfo loaded_models = 6;
}

message InstallProviderRequest {
  string name = 1;
  string engine = 2;
  string version = 3;
  string gpu_variant = 4;
  // plan-191 Task 7: installation parameters (append-only extension)
  bool force = 5;             // allow overwriting an existing version dir
  string git_url = 6;         // empty = prebuilt download; non-empty = source build
}

message UpdateProviderRequest {
  string name = 1;
  string version = 2;         // the (already resolved) new version
  // plan-191 Task 7: update parameters (append-only extension)
  string engine = 3;
  string gpu_variant = 4;
  string git_url = 5;         // empty = prebuilt download; non-empty = source build
}

message RemoveProviderRequest {
  string name = 1;
  // plan-191 Task 7: remove scope (append-only extension)
  string engine = 2;          // backend type string (install-dir key)
  string gpu_variant = 3;     // empty = all variants of the backend
  string version = 4;         // empty = all versions
}

message LogsRequest {
  // Optional fallback — if model_name is empty, use the single running
  // process whose provider_name matches (ambiguous match → empty stream).
  string provider_name = 1;
  // Non-empty = tail the engine logs for the backend serving this model:
  // the Docker container "tama-<model_name>" the backend process runs in
  // (native host backends have no container and yield an empty stream).
  // Preferred over the provider_name fallback.
  string model_name = 2;
}

message LogEntry {
  string timestamp = 1;
  string level = 2;
  string message = 3;
}

message HealthResponse {
  string status = 1;
  string version = 2;
}

// v2 additions (plan-191)

message StatsRequest {}

message GpuInfo {
  int32 index = 1;
  string name = 2;
  string driver_version = 3;
  int64 vram_total_bytes = 4;
  int64 vram_used_bytes = 5;
  double utilization_percent = 6;
  double temperature_c = 7;
  double power_w = 8;
  // 0-100 fan duty cycle; 0 when unavailable.
  double fan_percent = 9;
}

message ProcessInfo {
  string model_name = 1;     // unique key for a loaded model's process
  string provider_name = 2;  // backend name, e.g. "llama.cpp"
  int32 pid = 3;
  bool alive = 4;
  string endpoint_url = 5;
  string status = 6;          // "starting" | "ready" | "restarting" | "failed" | "budget_exhausted" | "unloading"
  bool   desired = 7;
  uint32 restart_count = 8;
  uint32 max_restarts = 9;

  // Spec-decode observation scraped by the tamad from the backend's
  // Prometheus /metrics (vLLM-only; None = no spec traffic observed
  // recently or engine is not vLLM). See ADR-0012.
  optional double spec_accept_pct = 10;
  bool spec_decoding_active = 11;

  // Inference stats observed by the tamad's /metrics scrape (ADR-0014):
  // windowed Δ/Δt over the measured scrape interval. None = no traffic in
  // the window, observation stale (>30s), or the engine doesn't expose
  // the counter.
  optional double tps = 12;
  optional double prompt_tps = 13;
  optional double cache_hit_pct = 14;

  // Unix millis (tamad clock) of the last traffic-bearing observation window;
  // ADR-0014. None = no traffic in the last 30s (or never observed). The
  // proxy stamps the per-backend inference entry's last_updated_ms from this
  // so the aggregate's "most recently active backend wins" is deterministic
  // (no shared-timestamp ties).
  optional int64 last_obs_ms = 15;
}

message SystemStats {
  double cpu_usage_percent = 1;
  int64 memory_total_bytes = 2;
  int64 memory_used_bytes = 3;
  int64 swap_total_bytes = 4;
  int64 swap_used_bytes = 5;
  int64 disk_total_bytes = 6; // models dir filesystem
  int64 disk_free_bytes = 7;
  repeated GpuInfo gpus = 8;
  repeated ProcessInfo processes = 9;  // full snapshot of running backends
}

message JobIdResponse { string job_id = 1; }

message JobRequest { string job_id = 1; }

message JobEvent {
  string job_id = 1;
  string kind = 2;            // "install" | "update" | "pull" | "benchmark"
  int32 progress = 3;         // 0-100
  string message = 4;
  string status = 5;          // "running" | "succeeded" | "failed"
  string result_json = 6;     // terminal-event payload (results, file list, ...)
  string error = 7;
  int64 bytes_downloaded = 8; // pull jobs: bytes written so far
  int64 total_bytes = 9;      // pull jobs: expected total (0 = unknown)
}

message RestartProviderRequest { string model_name = 1; }

message CancelJobRequest { string job_id = 1; }

message CancelJobResponse {
  // True when the job was running and its runner was asked to stop; false
  // when the job id was unknown (idempotent cancel).
  bool cancelled = 1;
}

message PullModelRequest {
  string repo_id = 1;
  repeated string quants = 2;
  string model_name = 3;
  string backend = 4;
  string hf_token = 5;        // user's HF token for gated repos, may be empty
  bool repo_pull = 6;         // true = whole-repo safetensors pull via hf CLI
  // Absolute directory the repo's files must land in. When set, the host
  // writes here directly (instead of composing its own models_dir layout)
  // so the proxy finds the file at the exact path it expects. Empty = the
  // host composes the path from its own config.
  string dest_dir = 7;
}

message RunBenchmarkRequest {
  string model_name = 1;
  string kind = 2;            // "llama_bench" | "spec" | "mtp"
  string config_json = 3;     // serialized per-kind config
  // plan-191 Task 8: execution-host paths (append-only extension).
  // Both are RELATIVE to the tamad's own roots, because the proxy does not
  // know the tamad's --models-dir/--data-dir:
  //   model_path_rel   — model file, relative to the tamad's models dir
  //   binary_path_rel  — backend (llama-server) binary, relative to the
  //                      tamad's install dir (<data-dir>/install)
  string model_path_rel = 4;
  string binary_path_rel = 5;
}

// ───────────────────────────────────────────────────────────────────────────
// plan-195 task 6 (stage 2a): structured log push protocol.
//
// APPEND-ONLY section — never renumber. `rpc Logs` and `LogEntry` above
// stay exactly as-is (legacy one-shot tail); the types below are the v2
// stream consumed by `StreamLogs`.
// ───────────────────────────────────────────────────────────────────────────

/// One structured log line pushed from a tamad.
message LoggedLine {
  // unix ms, capture time (tamad clock)
  int64 ts = 1;
  // 0..4 = TRACE..ERROR; -1 = unknown (engine container line)
  int32 level = 2;
  // "tamad" | "model:<model_name>"
  string source = 3;
  // JSON doc: {"message":str, "target":str?, ...fields}
  string message = 4;
  // monotonic per source, per boot
  int64 seq = 5;
  // true ⇒ synthetic drop marker
  bool dropped = 6;
  int64 dropped_count = 7;
  // unix ms, meaningful when dropped
  int64 dropped_since_ts = 8;
}

/// First frame of every `StreamLogs` stream: the tamad announces its
/// per-boot identity and where the replay ring currently starts per
/// source (0 when that source has no surviving line).
message StreamInit {
  // per-boot UUID v4 (NOT the pid)
  string instance_id = 1;
  // source → 0 (or the surviving ring's min-seq)
  map<string, int64> start_seq_by_source = 2;
}

/// Wire envelope: an init frame or a log line.
message StreamLogMessage {
  oneof kind {
    StreamInit init = 1;
    LoggedLine line = 2;
  }
}
